<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>বাংলাদেশ ও বিশ্বপরিচয় (৭ম শ্রেণি) — Class 7 Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f4f7fb;
      --bg-surface: #ffffff;
      --bg-subtle: #eef3fa;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --primary-light: #eef2ff;
      --subject-accent: #d97706;
      --subject-accent-dark: #b45309;
      --subject-accent-light: #fffbeb;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --font-sans: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-bangla: "Noto Sans Bengali", "Hind Siliguri", "SolaimanLipi", "Kalpurush", sans-serif;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-bangla), var(--font-sans);
      background: var(--bg-page);
      color: var(--text-primary);
      font-size: 15.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 14px;
    }

    /* Sticky Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 56px;
      padding: 8px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--subject-accent-light);
      border: 1px solid #fde68a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .nav-pill:hover { background: #e2e8f0; }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      background: var(--subject-accent-light);
      color: var(--subject-accent-dark);
      border: 1px solid #fcd34d;
      font-size: 13.5px;
      font-weight: 700;
    }

    /* Subject Banner */
    .subject-banner {
      background: linear-gradient(135deg, #b45309 0%, #d97706 55%, #f59e0b 100%);
      color: #ffffff;
      padding: 18px 0 20px;
      margin-bottom: 16px;
    }

    .subject-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .subject-title-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .subject-banner h1 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
    }

    .subject-banner p {
      font-size: 13.5px;
      opacity: 0.94;
      margin-top: 2px;
    }

    /* Stats Strip */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-val {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }

    .stat-lbl {
      font-size: 11.5px;
      opacity: 0.92;
      margin-top: 2px;
    }

    /* Cards & Layout */
    .main-wrap {
      padding-bottom: 44px;
    }

    .section-heading {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 18px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .chapter-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .chapter-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      width: 100%;
      font-family: inherit;
    }

    .chapter-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: #fbbf24;
    }

    .chapter-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chapter-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--subject-accent-light);
      border: 1px solid #fde68a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .chapter-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--subject-accent-dark);
      text-transform: uppercase;
    }

    .chapter-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .chapter-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .chapter-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .mini-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      background: var(--bg-subtle);
      color: var(--text-secondary);
    }

    .mini-badge.done {
      background: var(--success-light);
      color: #065f46;
    }

    /* Model Test Cards */
    .mt-card {
      border-left: 4px solid var(--primary);
    }
    .mt-card.gan {
      border-left-color: #0d9488;
    }

    /* Content Card */
    .content-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
    }

    .topic-header-card {
      border-left: 4px solid var(--subject-accent);
    }

    .topic-header-card h2 {
      font-size: 17.5px;
      font-weight: 700;
      line-height: 1.35;
    }

    .topic-subtitle {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* Tabs */
    .main-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--bg-surface);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .tab-btn {
      padding: 10px 6px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 44px;
    }

    .tab-btn.active {
      background: var(--subject-accent);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.25);
    }

    /* Sub-section Pills (৫টি পর্ব) */
    .part-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .part-pill {
      flex: 1 1 auto;
      min-width: 72px;
      padding: 8px 10px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .part-pill.active {
      background: var(--text-primary);
      color: #ffffff;
      border-color: var(--text-primary);
    }

    .part-pill.completed {
      border-color: var(--success);
      color: #065f46;
      background: var(--success-light);
    }
    .part-pill.completed.active {
      background: var(--success);
      color: #ffffff;
    }

    /* Audio Toolbar */
    .audio-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--subject-accent-light);
      border: 1px solid #fde68a;
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .audio-bar-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--subject-accent-dark);
    }

    .speed-group {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .speed-btn {
      padding: 4px 9px;
      border-radius: var(--radius-full);
      border: 1px solid #fcd34d;
      background: #ffffff;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .speed-btn.active {
      background: var(--subject-accent);
      color: #ffffff;
      border-color: var(--subject-accent);
    }

    /* Summary Cards */
    .summary-card {
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .summary-card.is-speaking {
      border-color: var(--subject-accent);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }

    .summary-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .summary-card-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .points-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .points-list li {
      position: relative;
      padding-left: 18px;
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.65;
    }

    .points-list li::before {
      content: "•";
      position: absolute;
      left: 3px;
      top: 0;
      color: var(--subject-accent);
      font-weight: 800;
      font-size: 18px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-sm {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 13px;
    }

    .btn-primary {
      background: var(--subject-accent);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--subject-accent-dark); }

    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text-primary);
      border-color: var(--border-color);
    }
    .btn-secondary:hover { background: #e2e8f0; }

    .btn-success {
      background: var(--success);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
    }

    /* Progress Bar */
    .progress-wrap {
      margin-bottom: 14px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--border-color);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--subject-accent);
      border-radius: var(--radius-full);
      transition: width 0.25s ease;
    }

    /* MCQ Styles */
    .mcq-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .mcq-source-tag {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: var(--primary-light);
      color: var(--primary-dark);
      margin-bottom: 6px;
    }

    .mcq-q {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .practice-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @media (min-width: 540px) {
      .practice-options { grid-template-columns: 1fr 1fr; }
    }

    .option-btn {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.45;
      transition: all 0.15s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--subject-accent);
      background: var(--subject-accent-light);
    }

    .option-btn.is-correct {
      background: var(--success-light);
      border-color: var(--success);
      color: #065f46;
      font-weight: 700;
    }

    .option-btn.is-wrong {
      background: var(--danger-light);
      border-color: var(--danger);
      color: #991b1b;
    }

    .option-letter {
      font-weight: 700;
      color: var(--subject-accent-dark);
      flex-shrink: 0;
    }

    .practice-feedback {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      line-height: 1.55;
    }

    .practice-feedback.ok {
      background: var(--success-light);
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .practice-feedback.err {
      background: var(--danger-light);
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    /* Ganmulok (Active Recall) */
    .qa-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .qa-question {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .qa-answer {
      margin-top: 10px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      border-left: 3px solid var(--subject-accent);
      font-size: 14.5px;
      color: var(--text-primary);
      line-height: 1.6;
      display: none;
    }

    .qa-answer.is-open {
      display: block;
    }

    .qa-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .qa-rate-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .qa-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-full);
    }
    .qa-status-badge.known { background: var(--success-light); color: #065f46; }
    .qa-status-badge.missed { background: var(--danger-light); color: #991b1b; }

    /* Toolbar Row */
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* Toast Notice */
    .toast-notice {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: var(--radius-full);
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      z-index: 100;
      max-width: 92vw;
      text-align: center;
      display: none;
    }
    .toast-notice.show { display: block; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <button type="button" class="brand" id="btnHomeBrand">
        <span class="brand-badge" aria-hidden="true">🎓</span>
        <span>Class 7 BGS</span>
      </button>
      <div class="header-actions">
        <button type="button" class="nav-pill hidden" id="btnBackHome">&larr; সব অধ্যায়</button>
        <span class="score-pill" id="headerPoints">⭐ ০ পয়েন্ট</span>
      </div>
    </div>
  </header>

  <section class="subject-banner">
    <div class="container">
      <div class="subject-title-row">
        <div class="subject-title-icon" aria-hidden="true">🌏</div>
        <div>
          <h1>বাংলাদেশ ও বিশ্বপরিচয় (৭ম শ্রেণি)</h1>
          <p id="bannerSubtitle">অধ্যায়ভিত্তিক সারসংক্ষেপ, অডিও, গেমিফাইড MCQ, জ্ঞানমূলক ও মডেল টেস্ট</p>
        </div>
      </div>
      <div class="stats-strip">
        <div class="stat-box">
          <div class="stat-val" id="statPoints">০</div>
          <div class="stat-lbl">মোট পয়েন্ট</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statCorrect">০</div>
          <div class="stat-lbl">সঠিক উত্তর</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statStreak">০</div>
          <div class="stat-lbl">বর্তমান স্ট্রিক</div>
        </div>
      </div>
    </div>
  </section>

  <main class="container main-wrap" id="appMain"></main>

  <script>

    // Bangla digits helper
    const BN_DIGITS = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    function toBn(num) {
      return String(num).replace(/[0-9]/g, d => BN_DIGITS[Number(d)]);
    }

    // Toast helper (replaces alert)
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toastNotice');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
    }

    // Shared Class7Audio-compatible Bangla TTS engine
    window.Class7Audio = window.Class7Audio || (function () {
      const supported = typeof window !== 'undefined' && 'speechSynthesis' in window;
      let rate = 1.0;
      let currentKey = null;

      function getBanglaVoice() {
        if (!supported) return null;
        const voices = window.speechSynthesis.getVoices() || [];
        return (
          voices.find(v => v.lang && v.lang.toLowerCase() === 'bn-bd') ||
          voices.find(v => v.lang && v.lang.toLowerCase().startsWith('bn')) ||
          null
        );
      }

      function stop(cb) {
        if (supported) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        currentKey = null;
        if (typeof cb === 'function') cb();
      }

      function speakText(text, key, callbacks = {}) {
        if (!supported) {
          if (callbacks.onNotice) callbacks.onNotice('আপনার ব্রাউজারে বাংলা অডিও সাপোর্ট নেই।');
          return;
        }
        stop();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'bn-BD';
        utter.rate = rate;
        const bnVoice = getBanglaVoice();
        if (bnVoice) {
          utter.voice = bnVoice;
        } else if (callbacks.onNotice) {
          callbacks.onNotice('ডিভাইসে বাংলা ভয়েস প্যাক না থাকলে অডিও নাও শোনা যেতে পারে।');
        }
        currentKey = key;
        utter.onstart = () => { if (callbacks.onStart) callbacks.onStart(); };
        utter.onend = () => {
          if (currentKey === key) currentKey = null;
          if (callbacks.onEnd) callbacks.onEnd();
        };
        utter.onerror = () => {
          if (currentKey === key) currentKey = null;
          if (callbacks.onEnd) callbacks.onEnd();
        };
        try {
          window.speechSynthesis.speak(utter);
        } catch (e) {
          currentKey = null;
          if (callbacks.onEnd) callbacks.onEnd();
        }
      }

      if (supported && window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = () => { getBanglaVoice(); };
      }

      return {
        isSupported: supported,
        setRate(r) { rate = r; },
        getRate() { return rate; },
        getCurrentKey() { return currentKey; },
        speakText,
        stop
      };
    })();

    // Persistent State (wrapped in try/catch for Canvas safety)
    const STORAGE_KEY = 'class7_bgs_gamified_v1';
    function loadState() {
      const def = {
        points: 0,
        correctCount: 0,
        streak: 0,
        mcqState: {},   // key -> { solved: bool, wrong: [idx], firstTry: bool }
        ganState: {}    // key -> { revealed: bool, status: 'known'|'missed'|null }
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return Object.assign(def, parsed);
        }
      } catch (e) {}
      return def;
    }

    let appState = loadState();
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {}
      updateHeaderStats();
    }

    function updateHeaderStats() {
      const ptsText = toBn(appState.points);
      document.getElementById('headerPoints').textContent = `⭐ ${ptsText} পয়েন্ট`;
      document.getElementById('statPoints').textContent = ptsText;
      document.getElementById('statCorrect').textContent = toBn(appState.correctCount);
      document.getElementById('statStreak').textContent = toBn(appState.streak);
    }

    // Current Navigation View
    let viewState = {
      mode: 'home',       // 'home' | 'chapter' | 'mcq_mt' | 'gan_mt'
      chapterId: null,
      tab: 'summary',     // 'summary' | 'mcq' | 'gan'
      mcqPart: 0,         // 0..4 (6 questions each)
      ganPart: 0,         // 0..4 (4 questions each)
      mtId: null,
      speakingKey: null
    };

    function goHome() {
      window.Class7Audio.stop();
      viewState.speakingKey = null;
      viewState.mode = 'home';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openChapter(chId) {
      window.Class7Audio.stop();
      viewState.speakingKey = null;
      viewState.mode = 'chapter';
      viewState.chapterId = chId;
      viewState.tab = 'summary';
      viewState.mcqPart = 0;
      viewState.ganPart = 0;
      render();

      window.Class7Audio.stop();

      let mcqDone = 0;
      ch.mcqs.forEach((_, idx) => {

      });
      let ganDone = 0;
      ch.ganmulok.forEach((_, idx) => {
        if (appState.ganState[`${ch.id}_gan_${idx}`]?.status === 'known') ganDone++;
      });
      return { mcqDone, ganDone };

    // Render MCQ List Helper (used by both Chapter 6-per-part and Model Test 30)
    function renderMcqList(questions, keyPrefix, showSource = false) {
      const letters = ['ক', 'খ', 'গ', 'ঘ'];
      let html = '';
      questions.forEach((item, idx) => {
        const stateKey = `${keyPrefix}_${item._origIdx !== undefined ? item._origIdx : idx}`;
        const st = appState.mcqState[stateKey] || { solved: false, wrong: [], firstTry: false };
        html += `
          <div class="mcq-item">
            ${showSource && item.source ? `<span class="mcq-source-tag">${item.source}</span>` : ''}
            <div class="mcq-q">${toBn(idx + 1)}. ${item.q}</div>
            <div class="practice-options">
              ${item.opts.map((opt, oIdx) => {
                let cls = 'option-btn';
                let disabled = '';
                if (st.solved && oIdx === item.ans) cls += ' is-correct';
                else if (st.wrong.includes(oIdx)) { cls += ' is-wrong'; disabled = 'disabled'; }
                if (st.solved) disabled = 'disabled';
                return `
                  <button type="button" class="${cls}" ${disabled} data-mcq-key="${stateKey}" data-opt="${oIdx}" data-ans="${item.ans}">
                    <span class="option-letter">${letters[oIdx]}.</span>
                    <span>${opt}</span>
                  </button>
                `;
              }).join('')}
            </div>
            ${st.solved ? `
              <div class="practice-feedback ok">
                ✅ <strong>সঠিক উত্তর!</strong> ${st.firstTry ? '(প্রথম চেষ্টায় +১০ পয়েন্ট)' : '(সমাধান সম্পন্ন)'}<br/>
                ${item.exp}
              </div>
            ` : st.wrong.length > 0 ? `
              <div class="practice-feedback err">
                ❌ ভুল উত্তর (−২ পয়েন্ট)। আবার চেষ্টা করে সঠিক উত্তরটি খুঁজে বের করো!
              </div>
            ` : ''}
          </div>
        `;
      });
      return html;
    }

    // Render Ganmulok List Helper
    function renderGanList(questions, keyPrefix, showSource = false) {
      let html = '';
      questions.forEach((item, idx) => {

          <div class="qa-item">
            ${showSource && item.source ? `<span class="mcq-source-tag">${item.source}</span>` : ''}

              <button type="button" class="btn btn-sm ${st.revealed ? 'btn-secondary' : 'btn-primary'}" data-toggle-gan="${stateKey}">

              </button>
              ${st.status === 'known' ? `<span class="qa-status-badge known">✅ পেরেছি (+৫)</span>` : ''}
              ${st.status === 'missed' ? `<span class="qa-status-badge missed">❌ আবার অনুশীলন করো</span>` : ''}

            </div>
          </div>

    // Master Render
    function render() {
      const main = document.getElementById('appMain');
      if (viewState.mode === 'home') main.innerHTML = renderHome();
      else if (viewState.mode === 'chapter') main.innerHTML = renderChapter();
      else if (viewState.mode === 'mcq_mt') main.innerHTML = renderMcqModelTest();
      else if (viewState.mode === 'gan_mt') main.innerHTML = renderGanModelTest();
      updateHeaderStats();
    }

    // Event Delegation
    document.getElementById('btnHomeBrand').addEventListener('click', goHome);
    document.getElementById('btnBackHome').addEventListener('click', goHome);

    document.getElementById('appMain').addEventListener('click', (e) => {
      const target = e.target.closest('button');
      if (!target) return;

      if (target.dataset.openCh) {
        openChapter(target.dataset.openCh);
        return;
      }
      if (target.dataset.openMcqMt) {
        openModelTest('mcq_mt', target.dataset.openMcqMt);
        return;
      }
      if (target.dataset.openGanMt) {
        openModelTest('gan_mt', target.dataset.openGanMt);
        return;
      }
      if (target.dataset.tab) {
        window.Class7Audio.stop();
        viewState.speakingKey = null;
        viewState.tab = target.dataset.tab;
        render();
        return;
      }
      if (target.dataset.rate) {
        window.Class7Audio.setRate(parseFloat(target.dataset.rate));
        render();
        return;
      }
      if (target.dataset.speakSum !== undefined) {
        const idx = Number(target.dataset.speakSum);
        const ch = APP_DATA.chapters.find(c => c.id === viewState.chapterId);
        if (!ch) return;
        const key = `${ch.id}_sum_${idx}`;
        if (viewState.speakingKey === key) {
          window.Class7Audio.stop(() => {
            viewState.speakingKey = null;
            render();
          });
        } else {
          const sec = ch.summaries[idx];
          const textToRead = sec.title + '। ' + sec.points.join(' ');
          viewState.speakingKey = key;
          render();
          window.Class7Audio.speakText(textToRead, key, {
            onEnd: () => {
              if (viewState.speakingKey === key) {
                viewState.speakingKey = null;
                render();
              }
            },
            onNotice: (msg) => showToast(msg)
          });
        }
        return;
      }
      if (target.dataset.mcqPart !== undefined) {
        const p = Number(target.dataset.mcqPart);
        if (p >= 0 && p <= 4) {
          viewState.mcqPart = p;
          render();
          window.scrollTo({ top: 140, behavior: 'smooth' });
        }
        return;
      }
      if (target.dataset.ganPart !== undefined) {
        const p = Number(target.dataset.ganPart);
        if (p >= 0 && p <= 4) {
          viewState.ganPart = p;
          render();
          window.scrollTo({ top: 140, behavior: 'smooth' });
        }
        return;
      }
      if (target.dataset.mcqKey) {
        const key = target.dataset.mcqKey;
        const opt = Number(target.dataset.opt);
        const ans = Number(target.dataset.ans);
        const st = appState.mcqState[key] || { solved: false, wrong: [], firstTry: false };
        if (st.solved || st.wrong.includes(opt)) return;

        if (opt === ans) {
          st.solved = true;
          if (st.wrong.length === 0) {
            st.firstTry = true;
            appState.points += 10;
            appState.streak += 1;
          } else {
            st.firstTry = false;
            appState.streak = 0;
          }
          appState.correctCount += 1;
          appState.mcqState[key] = st;
          saveState();
          render();
        } else {
          st.wrong.push(opt);
          appState.points = Math.max(0, appState.points - 2);
          appState.streak = 0;
          appState.mcqState[key] = st;
          saveState();
          render();
        }
        return;
      }
      if (target.dataset.resetChMcq) {
        const chId = target.dataset.resetChMcq;
        for (let i = 0; i < 30; i++) delete appState.mcqState[`${chId}_mcq_${i}`];
        saveState();
        showToast('এই অধ্যায়ের সব MCQ রিসেট করা হয়েছে!');
        render();
        return;
      }
      if (target.dataset.resetMtMcq) {
        const mtId = target.dataset.resetMtMcq;
        for (let i = 0; i < 30; i++) delete appState.mcqState[`${mtId}_${i}`];
        saveState();
        showToast('মডেল টেস্ট রিসেট করা হয়েছে!');
        render();
        return;
      }
      if (target.dataset.toggleGan) {
        const key = target.dataset.toggleGan;
        const st = appState.ganState[key] || { revealed: false, status: null };
        st.revealed = !st.revealed;
        appState.ganState[key] = st;
        saveState();
        render();
        return;
      }
      if (target.dataset.rateGan) {
        const key = target.dataset.rateGan;
        const val = target.dataset.val;
        const st = appState.ganState[key] || { revealed: true, status: null };
        if (st.status) return;
        st.status = val;
        if (val === 'known') {
          appState.points += 5;
          appState.correctCount += 1;
          appState.streak += 1;
        } else {
          appState.points = Math.max(0, appState.points - 1);
          appState.streak = 0;
        }
        appState.ganState[key] = st;
        saveState();
        render();
        return;
      }
      if (target.dataset.resetChGan) {
        const chId = target.dataset.resetChGan;
        for (let i = 0; i < 20; i++) delete appState.ganState[`${chId}_gan_${i}`];
        saveState();
        showToast('জ্ঞানমূলক প্রশ্নগুলো রিসেট করা হয়েছে!');
        render();
        return;
      }
      if (target.dataset.resetMtGan) {
        const mtId = target.dataset.resetMtGan;
        for (let i = 0; i < 20; i++) delete appState.ganState[`${mtId}_${i}`];
        saveState();
        showToast('জ্ঞানমূলক মডেল টেস্ট রিসেট করা হয়েছে!');
        render();
        return;
      }
    });

    // Initial render
    render();
  </script>
</body>
</html>
