    function renderMcqSteps(container, items, numSteps, headingLabel) {
      const steps = splitIntoSteps(items, numSteps);
      if (state.stepIndex >= steps.length) state.stepIndex = 0;
      const currentItems = steps[state.stepIndex] || [];
      const totalSolved = items.filter(it => state.mcqStatus[it._key]?.solved).length;
      const pct = items.length ? Math.round((totalSolved / items.length) * 100) : 0;

      let html = `
        <div class="content-card">
          <div class="step-bar">
            <strong style="font-size:15px;">${headingLabel} — ধাপ ${toBn(state.stepIndex + 1)}/${toBn(steps.length)}</strong>
            <span class="mini-pill done">সমাধান: ${toBn(totalSolved)}/${toBn(items.length)} (${toBn(pct)}%)</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="step-dots">
            ${steps.map((st, idx) => {
              const allDone = st.every(it => state.mcqStatus[it._key]?.solved);
              return `<button type="button" class="step-dot ${idx === state.stepIndex ? 'active' : (allDone ? 'completed' : '')}" data-step="${idx}">ধাপ ${toBn(idx + 1)}</button>`;
            }).join("")}
          </div>
        </div>
      `;

      currentItems.forEach(it => {
        const rec = state.mcqStatus[it._key] || { wrong: [], solved: false, earned: 0 };
        html += `<div class="mcq-card" data-qkey="${it._key}">`;
        if (it.source) {
          html += `<span class="mcq-source-tag">অধ্যায়: ${it.source}</span>`;
        }
        html += `<p class="mcq-q">${toBn(it._num)}. ${it.q}</p><div class="practice-options">`;
        it.options.forEach((opt, oIdx) => {
          const isWrong = rec.wrong.includes(oIdx);
          const isRight = rec.solved && oIdx === it.ans;
          const cls = isRight ? "is-correct" : (isWrong ? "is-wrong" : "");
          const dis = (rec.solved || isWrong) ? "disabled" : "";
          html += `
            <button type="button" class="option-btn ${cls}" ${dis} data-opt="${oIdx}" data-key="${it._key}" data-ans="${it.ans}">
              <strong>${OPT_LETTERS[oIdx]}.</strong> <span>${opt}</span>
            </button>
          `;
        });
        html += `</div>`;
        if (rec.solved) {
          const msg = rec.wrong.length === 0
            ? `দারুণ! প্রথম চেষ্টাতেই সঠিক (+${toBn(rec.earned)} পয়েন্ট)`
            : `সঠিক উত্তর পাওয়া গেছে (${toBn(rec.wrong.length)}টি ভুল চেষ্টার পর, নিট +${toBn(rec.earned)} পয়েন্ট)`;
          html += `<div class="practice-feedback ok">${msg}</div>`;
        } else if (rec.wrong.length > 0) {
          html += `<div class="practice-feedback err">ভুল অনুমান! (-${toBn(rec.wrong.length * 2)} পয়েন্ট কাটা হয়েছে)। সঠিক উত্তরটি খুঁজে বের করুন।</div>`;
        }
        html += `</div>`;
      });

      html += `
        <div class="lesson-nav">
          <button type="button" class="btn btn-secondary" id="btnPrevStep" ${state.stepIndex === 0 ? 'disabled' : ''}>← পূর্ববর্তী ধাপ</button>
          <button type="button" class="btn btn-primary" id="btnNextStep" ${state.stepIndex >= steps.length - 1 ? 'disabled' : ''}>পরবর্তী ধাপ →</button>
        </div>
      `;

      container.innerHTML = html;

      container.querySelectorAll("[data-step]").forEach(b => {
        b.addEventListener("click", () => {
          state.stepIndex = Number(b.getAttribute("data-step"));
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      container.querySelectorAll("[data-opt]").forEach(b => {
        b.addEventListener("click", () => {
          const key = b.getAttribute("data-key");
          const chosen = Number(b.getAttribute("data-opt"));
          const ans = Number(b.getAttribute("data-ans"));
          const rec = state.mcqStatus[key] || { wrong: [], solved: false, earned: 0 };
          if (rec.solved || rec.wrong.includes(chosen)) return;

          if (chosen === ans) {
            const wrongCount = rec.wrong.length;
            const reward = wrongCount === 0 ? 10 : (wrongCount === 1 ? 5 : (wrongCount === 2 ? 2 : 0));
            rec.solved = true;
            rec.earned = reward;
            state.points += reward;
            if (wrongCount === 0) {
              state.streak += 1;
              if (state.streak > state.bestStreak) state.bestStreak = state.streak;
            } else {
              state.streak = 0;
            }
            state.mcqStatus[key] = rec;
            saveState();
            showToast(reward > 0 ? `+${toBn(reward)} পয়েন্ট যোগ হয়েছে!` : "সঠিক উত্তর!");
            render();
          } else {
            rec.wrong.push(chosen);
            state.points = Math.max(0, state.points - 2);
            state.streak = 0;
            state.mcqStatus[key] = rec;
            saveState();
            showToast("ভুল উত্তর! -২ পয়েন্ট");
            render();
          }
        });
      });

      const prevBtn = document.getElementById("btnPrevStep");
      const nextBtn = document.getElementById("btnNextStep");
      if (prevBtn) prevBtn.addEventListener("click", () => {
        if (state.stepIndex > 0) { state.stepIndex--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      });
      if (nextBtn) nextBtn.addEventListener("click", () => {
        if (state.stepIndex < steps.length - 1) { state.stepIndex++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      });
    }

    function renderGyanSteps(container, items, numSteps) {
      const steps = splitIntoSteps(items, numSteps);
      if (state.stepIndex >= steps.length) state.stepIndex = 0;
      const currentItems = steps[state.stepIndex] || [];
      const totalDone = items.filter(it => state.gyanStatus[it._key]?.result).length;
      const pct = items.length ? Math.round((totalDone / items.length) * 100) : 0;

      let html = `
        <div class="content-card">
          <div class="step-bar">
            <strong style="font-size:15px;">জ্ঞানমূলক (অ্যাক্টিভ রিকল) — ধাপ ${toBn(state.stepIndex + 1)}/${toBn(steps.length)}</strong>
            <span class="mini-pill done">সম্পন্ন: ${toBn(totalDone)}/${toBn(items.length)} (${toBn(pct)}%)</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="step-dots">
            ${steps.map((st, idx) => {
              const allDone = st.every(it => state.gyanStatus[it._key]?.result);
              return `<button type="button" class="step-dot ${idx === state.stepIndex ? 'active' : (allDone ? 'completed' : '')}" data-step="${idx}">ধাপ ${toBn(idx + 1)}</button>`;
            }).join("")}
          </div>
        </div>
      `;

      currentItems.forEach(it => {
        const rec = state.gyanStatus[it._key] || { revealed: false, result: null };
        html += `<div class="qa-item">`;
        if (it.source) {
          html += `<span class="mcq-source-tag">অধ্যায়: ${it.source}</span>`;
        }
        html += `
          <p class="qa-question">${toBn(it._num)}. ${it.q}</p>
          <button type="button" class="btn btn-secondary btn-sm" data-toggle-ans="${it._key}">
            ${rec.revealed ? "🙈 উত্তর লুকান" : "👁️ উত্তর দেখুন"}
          </button>
          <div class="qa-answer ${rec.revealed ? 'is-open' : ''}">
            <strong>উত্তর:</strong> ${it.a}
          </div>
        `;
        if (rec.revealed) {
          html += `
            <div class="qa-actions">
              <button type="button" class="btn btn-sm ${rec.result === 'ok' ? 'btn-success' : 'btn-primary'}" data-gyan-ok="${it._key}" ${rec.result ? 'disabled' : ''}>
                ✅ আমি পেরেছি (+৫ পয়েন্ট)
              </button>
              <button type="button" class="btn btn-sm btn-outline-warn" data-gyan-retry="${it._key}" ${rec.result ? 'disabled' : ''}>
                🔄 মনে করতে পারিনি (-১ পয়েন্ট)
              </button>
            </div>
          `;
          if (rec.result === "ok") {
            html += `<div class="practice-feedback ok">চমৎকার! অ্যাক্টিভ রিকলে +৫ পয়েন্ট অর্জিত হয়েছে।</div>`;
          } else if (rec.result === "retry") {
            html += `<div class="practice-feedback err">সমস্যা নেই, উত্তরটি ভালো করে পড়ে নিন (-১ পয়েন্ট)।</div>`;
          }
        }
        html += `</div>`;
      });

      html += `
        <div class="lesson-nav">
          <button type="button" class="btn btn-secondary" id="btnPrevGyan" ${state.stepIndex === 0 ? 'disabled' : ''}>← পূর্ববর্তী ধাপ</button>
          <button type="button" class="btn btn-primary" id="btnNextGyan" ${state.stepIndex >= steps.length - 1 ? 'disabled' : ''}>পরবর্তী ধাপ →</button>
        </div>
      `;

      container.innerHTML = html;

      container.querySelectorAll("[data-step]").forEach(b => {
        b.addEventListener("click", () => {
          state.stepIndex = Number(b.getAttribute("data-step"));
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      container.querySelectorAll("[data-toggle-ans]").forEach(b => {
        b.addEventListener("click", () => {
          const key = b.getAttribute("data-toggle-ans");
          const rec = state.gyanStatus[key] || { revealed: false, result: null };
          rec.revealed = !rec.revealed;
          state.gyanStatus[key] = rec;
          saveState();
          render();
        });
      });

      container.querySelectorAll("[data-gyan-ok]").forEach(b => {
        b.addEventListener("click", () => {
          const key = b.getAttribute("data-gyan-ok");
          const rec = state.gyanStatus[key] || { revealed: true, result: null };
          if (rec.result) return;
          rec.result = "ok";
          state.points += 5;
          state.streak += 1;
          state.gyanStatus[key] = rec;
          saveState();
          showToast("+৫ পয়েন্ট অর্জিত!");
          render();
        });
      });

      container.querySelectorAll("[data-gyan-retry]").forEach(b => {
        b.addEventListener("click", () => {
          const key = b.getAttribute("data-gyan-retry");
          const rec = state.gyanStatus[key] || { revealed: true, result: null };
          if (rec.result) return;
          rec.result = "retry";
          state.points = Math.max(0, state.points - 1);
          state.streak = 0;
          state.gyanStatus[key] = rec;
          saveState();
          showToast("-১ পয়েন্ট! উত্তরটি ঝালিয়ে নিন।");
          render();
        });
      });

      const prevBtn = document.getElementById("btnPrevGyan");
      const nextBtn = document.getElementById("btnNextGyan");
      if (prevBtn) prevBtn.addEventListener("click", () => {
        if (state.stepIndex > 0) { state.stepIndex--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      });
      if (nextBtn) nextBtn.addEventListener("click", () => {
        if (state.stepIndex < steps.length - 1) { state.stepIndex++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      });
    }

    function renderModelMcq(root) {
      const mt = APP_DATA.mcqTests.find(t => t.id === state.modelTestId);
      let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <button type="button" class="btn btn-secondary btn-sm" id="btnBackHomeMt">← হোমে ফিরুন</button>
          <span class="mini-pill">মোট ৩০টি প্রশ্ন</span>
        </div>
        <div id="mtBody"></div>
      `;
      root.innerHTML = html;
      document.getElementById("btnBackHomeMt").addEventListener("click", () => {
        state.view = "home";
        render();
      });
      const items = mt.questions.map((m, idx) => ({ ...m, _key: `${mt.id}_${idx}`, _num: idx + 1 }));
      renderMcqSteps(document.getElementById("mtBody"), items, 5, mt.title);
    }

    function renderModelGyan(root) {
      const gt = APP_DATA.gyanTests.find(t => t.id === state.modelTestId);
      let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <button type="button" class="btn btn-secondary btn-sm" id="btnBackHomeGt">← হোমে ফিরুন</button>
          <span class="mini-pill">মোট ২০টি প্রশ্ন</span>
        </div>
        <div id="gtBody"></div>
      `;
      root.innerHTML = html;
      document.getElementById("btnBackHomeGt").addEventListener("click", () => {
        state.view = "home";
        render();
      });
      const items = gt.questions.map((g, idx) => ({ ...g, _key: `${gt.id}_${idx}`, _num: idx + 1 }));
      renderGyanSteps(document.getElementById("gtBody"), items, 5);
    }

    document.getElementById("btnHomeBrand").addEventListener("click", () => {
      stopAudio();
      state.view = "home";
      render();
    });
    document.getElementById("btnHeaderHome").addEventListener("click", () => {
      stopAudio();
      state.view = "home";
      render();
    });
    document.getElementById("btnResetProgress").addEventListener("click", () => {
      stopAudio();
      state.points = 0;
      state.streak = 0;
      state.mcqStatus = {};
      state.gyanStatus = {};
      saveState();
      showToast("সব পয়েন্ট ও অগ্রগতি রিসেট করা হয়েছে");
      render();
    });

    render();
  </script>
</body>
</html>
