<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ইসলাম শিক্ষা — ৭ম শ্রেণি | Class 7 Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    :root {
      --subject-accent: #db2777;
    }

    /* Subject-scoped styles (.islam-*) so shared style.css rules are never overridden */
    .islam-fallback-shell {
      font-family: var(--font-bangla, "Noto Sans Bengali", system-ui, sans-serif);
      background: var(--bg-page, #f4f7fb);
      color: var(--text-primary, #1e293b);
      min-height: 100vh;
    }
    .islam-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 14px 48px;
      box-sizing: border-box;
    }
    .islam-stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .islam-stat-card {
      background: var(--bg-surface, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: var(--radius-md, 16px);
      padding: 12px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm, 0 2px 8px rgba(15,23,42,0.05));
    }
    .islam-stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--subject-accent, #db2777);
      line-height: 1.2;
    }
    .islam-stat-label {
      font-size: 0.78rem;
      color: var(--text-secondary, #475569);
      margin-top: 3px;
    }

    .islam-section-heading {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary, #1e293b);
      margin: 18px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .islam-chapter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .islam-chapter-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .islam-chapter-card {
      background: var(--bg-surface, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: var(--radius-md, 16px);
      padding: 16px;
      box-shadow: var(--shadow-sm, 0 2px 8px rgba(15,23,42,0.05));
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .islam-chapter-card:hover,
    .islam-chapter-card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--subject-accent, #db2777);
      box-shadow: var(--shadow-md, 0 8px 24px rgba(15,23,42,0.08));
      outline: none;
    }
    .islam-ch-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .islam-ch-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--subject-accent, #db2777);
      background: #fdf2f8;
      padding: 4px 10px;
      border-radius: 9999px;
    }
    .islam-ch-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-primary, #1e293b);
      margin: 0;
    }
    .islam-ch-sub {
      font-size: 0.88rem;
      color: var(--text-secondary, #475569);
      line-height: 1.5;
      margin: 0;
    }
    .islam-ch-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .islam-mini-pill {
      font-size: 0.76rem;
      padding: 3px 9px;
      border-radius: 9999px;
      background: var(--bg-subtle, #eef3fa);
      color: var(--text-secondary, #475569);
      font-weight: 600;
    }

    /* Chapter Detail Toolbar */
    .islam-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .islam-score-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      color: #be185d;
      padding: 7px 12px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    /* Main 3 Section Tabs */
    .islam-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .islam-tab-btn {
      min-height: 44px;
      padding: 8px 6px;
      border-radius: var(--radius-sm, 10px);
      border: 1.5px solid var(--border-color, #e2e8f0);
      background: var(--bg-surface, #ffffff);
      color: var(--text-secondary, #475569);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .islam-tab-btn.is-active {
      background: var(--subject-accent, #db2777);
      border-color: var(--subject-accent, #db2777);
      color: #ffffff;
    }

    /* Sub-section Stage Pills (1-5) */
    .islam-stage-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }
    .islam-stage-pill {
      min-height: 38px;
      padding: 6px 12px;
      border-radius: 9999px;
      border: 1.5px solid var(--border-color, #e2e8f0);
      background: var(--bg-surface, #ffffff);
      color: var(--text-secondary, #475569);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .islam-stage-pill.is-active {
      background: #fdf2f8;
      border-color: var(--subject-accent, #db2777);
      color: #be185d;
    }
    .islam-stage-pill.is-done {
      background: var(--success-light, #ecfdf5);
      border-color: var(--success, #10b981);
      color: #065f46;
    }

    /* Audio Controls */
    .islam-audio-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-surface, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: var(--radius-md, 16px);
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .islam-speed-group {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
    .islam-speed-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color, #e2e8f0);
      background: var(--bg-subtle, #eef3fa);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-primary, #1e293b);
    }
    .islam-speed-btn.is-active {
      background: var(--subject-accent, #db2777);
      color: #ffffff;
      border-color: var(--subject-accent, #db2777);
    }

    .islam-summary-card {
      background: var(--bg-surface, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-left: 4px solid var(--subject-accent, #db2777);
      border-radius: var(--radius-md, 16px);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm, 0 2px 8px rgba(15,23,42,0.05));
    }
    .islam-summary-card.is-speaking {
      background: #fdf2f8;
      border-color: var(--subject-accent, #db2777);
    }
    .islam-summary-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .islam-summary-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-primary, #1e293b);
      margin: 0;
    }
    .islam-points-list {
      margin: 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-primary, #1e293b);
    }

    /* MCQ Cards */
    .islam-q-card {
      background: var(--bg-surface, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: var(--radius-md, 16px);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm, 0 2px 8px rgba(15,23,42,0.05));
    }
    .islam-q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: var(--text-muted, #64748b);
      font-weight: 700;
    }
    .islam-q-text {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-primary, #1e293b);
      margin: 0 0 12px;
    }
    .islam-opts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .islam-opt-btn {
      min-height: 44px;
      padding: 10px 12px;
      border-radius: var(--radius-sm, 10px);
      border: 1.5px solid var(--border-color, #e2e8f0);
      background: var(--bg-subtle, #eef3fa);
      color: var(--text-primary, #1e293b);
      font-family: inherit;
      font-size: 0.93rem;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .islam-opt-btn:hover:not(:disabled) {
      border-color: var(--subject-accent, #db2777);
      background: #fdf2f8;
    }
    .islam-opt-btn.is-correct {
      background: var(--success-light, #ecfdf5);
      border-color: var(--success, #10b981);
      color: #065f46;
      font-weight: 700;
    }
    .islam-opt-btn.is-wrong {
      background: var(--danger-light, #fef2f2);
      border-color: var(--danger, #ef4444);
      color: #991b1b;
    }
    .islam-feedback {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .islam-feedback.ok {
      background: var(--success-light, #ecfdf5);
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .islam-feedback.err {
      background: var(--danger-light, #fef2f2);
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* Gyanmulok Active Recall */
    .islam-recall-box {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      font-size: 0.94rem;
      line-height: 1.65;
      color: var(--text-primary, #1e293b);
    }
    .islam-recall-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .islam-notice {
      background: var(--warning-light, #fffbeb);
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      margin-bottom: 12px;
    }

    .islam-action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .islam-btn {
      min-height: 42px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .islam-btn-primary {
      background: var(--subject-accent, #db2777);
      color: #ffffff;
    }
    .islam-btn-secondary {
      background: var(--bg-surface, #ffffff);
      border-color: var(--border-color, #e2e8f0);
      color: var(--text-primary, #1e293b);
    }
    .islam-btn-danger {
      background: var(--danger-light, #fef2f2);
      border-color: #fecaca;
      color: #b91c1c;
    }
    .islam-btn-success {
      background: var(--success-light, #ecfdf5);
      border-color: #a7f3d0;
      color: #065f46;
    }

    /* Fallback header/banner styling if style.css isn't loaded in standalone preview */
    .islam-banner-fallback {
      background: linear-gradient(135deg, #db2777, #9d174d);
      color: #ffffff;
      padding: 20px 14px;
    }
    .islam-header-fallback {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 14px;
    }
  </style>
</head>

  <script src="../../assets/js/audio.js"></script>
  <script>
    // Graceful fallback if audio.js is not present in standalone preview
    if (!window.Class7Audio) {
      window.Class7Audio = (function () {
        let rate = 1;
        let playing = false;
        const supported = typeof window !== "undefined" && "speechSynthesis" in window;
        function pickBanglaVoice() {
          if (!supported) return null;
          const voices = window.speechSynthesis.getVoices() || [];
          return voices.find(v => (v.lang || "").toLowerCase().startsWith("bn")) || null;
        }
        return {
          isSupported: supported,
          hasBanglaVoice: function () { return !!pickBanglaVoice(); },
          isPlaying: function () { return playing; },
          setRate: function (r) { rate = Math.min(2, Math.max(0.5, Number(r) || 1)); },
          stop: function (cb) {
            if (supported) window.speechSynthesis.cancel();
            playing = false;
            if (typeof cb === "function") cb();
          },
          speakText: function (text, lang, callbacks) {
            const cbs = callbacks || {};
            if (!supported) {
              if (cbs.onNotice) cbs.onNotice("আপনার ব্রাউজারে অডিও প্লেব্যাক সমর্থিত নয়।");
              return;
            }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang === "bn" ? "bn-BD" : "en-US";
            u.rate = rate;
            const bnVoice = pickBanglaVoice();
            if (lang === "bn" && bnVoice) {
              u.voice = bnVoice;
            } else if (lang === "bn" && !bnVoice && cbs.onNotice) {
              cbs.onNotice("ডিভাইসে বাংলা ভয়েস না থাকলে বাংলা অডিও পরিষ্কার নাও শোনা যেতে পারে।");
            }
            u.onstart = function () { playing = true; if (cbs.onStart) cbs.onStart(); };
            u.onend = function () { playing = false; if (cbs.onEnd) cbs.onEnd(); };
            u.onerror = function () { playing = false; if (cbs.onEnd) cbs.onEnd(); };
            window.speechSynthesis.speak(u);
          }
        };
      })();
    }

      chapterTab: "summary", // "summary" | "mcq" | "gyanmulok"
      mcqStage: 0, // 0..4 (6 questions each)
      gyanStage: 0, // 0..4 (4 questions each)
      mtId: null,
      audioRate: 1,
      speakingId: null,
      audioNotice: "",
      // Persistent gamified progress
      score: 0,
      streak: 0,
      mcqProgress: {},   // key: `${chapterId}:${idx}` -> { solved: bool, wrongOpts: [], attempts: num, pointsEarned: num }
      gyanProgress: {},  // key: `${chapterId}:${idx}` -> { revealed: bool, status: "known"|"review"|null }
      mtMcqProgress: {}, // key: `${mtId}:${idx}` -> { solved: bool, wrongOpts: [], pointsEarned: num }
      mtGyanProgress: {} // key: `${mtId}:${idx}` -> { revealed: bool, status: "known"|"review"|null }
    };

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (typeof saved.score === "number") state.score = saved.score;
        if (typeof saved.streak === "number") state.streak = saved.streak;
        if (saved.mcqProgress) state.mcqProgress = saved.mcqProgress;
        if (saved.gyanProgress) state.gyanProgress = saved.gyanProgress;
        if (saved.mtMcqProgress) state.mtMcqProgress = saved.mtMcqProgress;
        if (saved.mtGyanProgress) state.mtGyanProgress = saved.mtGyanProgress;
      } catch (e) {}
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          score: state.score,
          streak: state.streak,
          mcqProgress: state.mcqProgress,
          gyanProgress: state.gyanProgress,
          mtMcqProgress: state.mtMcqProgress,
          mtGyanProgress: state.mtGyanProgress
        }));
      } catch (e) {}
    }

    function toBnNum(n) {
      const digits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
      return String(n).replace(/\d/g, d => digits[Number(d)]);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getChapter(id) {
      return ISLAM_DATA.chapters.find(c => c.id === id);
    }

    function getChapterMcqStats(ch) {
      let solved = 0;
      ch.mcqs.forEach((_, i) => {
        if (state.mcqProgress[ch.id + ":" + i]?.solved) solved++;
      });
      return { solved, total: ch.mcqs.length };
    }

    function getChapterGyanStats(ch) {
      let done = 0;
      ch.gyanmulok.forEach((_, i) => {
        if (state.gyanProgress[ch.id + ":" + i]?.status) done++;
      });
      return { done, total: ch.gyanmulok.length };
    }

    function getTotalSolvedCount() {
      let count = 0;
      Object.values(state.mcqProgress).forEach(v => { if (v.solved) count++; });
      Object.values(state.gyanProgress).forEach(v => { if (v.status) count++; });
      Object.values(state.mtMcqProgress).forEach(v => { if (v.solved) count++; });
      Object.values(state.mtGyanProgress).forEach(v => { if (v.status) count++; });
      return count;
    }

    function stopAudio() {
      window.Class7Audio.stop(function () {
        state.speakingId = null;
        render();
      });
    }

    function speakSection(sectionId, text) {
      if (state.speakingId === sectionId) {
        stopAudio();
        return;
      }
      state.audioNotice = "";
      window.Class7Audio.setRate(state.audioRate);
      window.Class7Audio.speakText(text, "bn", {
        onStart: function () {
          state.speakingId = sectionId;
          render();
        },
        onEnd: function () {
          state.speakingId = null;
          render();
        },
        onNotice: function (msg) {
          state.audioNotice = msg;
          render();
        }
      });
    }

    function openChapter(id) {
      stopAudio();
      state.view = "chapter";
      state.chapterId = id;
      state.chapterTab = "summary";
      state.mcqStage = 0;
      state.gyanStage = 0;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openModelTest(type, id) {
      stopAudio();
      state.view = type;
      state.mtId = id;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goHome() {
      stopAudio();
      state.view = "home";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleMcqAnswer(scopeKey, qObj, optIndex, isModelTest) {
      const store = isModelTest ? state.mtMcqProgress : state.mcqProgress;
      const prev = store[scopeKey] || { solved: false, wrongOpts: [], attempts: 0, pointsEarned: 0 };
      if (prev.solved) return;
      if (prev.wrongOpts.includes(optIndex)) return;

      prev.attempts += 1;
      if (optIndex === qObj.ans) {
        prev.solved = true;
        const pts = prev.wrongOpts.length === 0 ? 10 : (prev.wrongOpts.length === 1 ? 4 : 2);
        prev.pointsEarned += pts;
        state.score += pts;
        if (prev.wrongOpts.length === 0) {
          state.streak += 1;
        } else {
          state.streak = 0;
        }
      } else {
        prev.wrongOpts.push(optIndex);
        prev.pointsEarned -= 2;
        state.score = Math.max(0, state.score - 2);
        state.streak = 0;
      }
      store[scopeKey] = prev;
      saveProgress();
      render();
    }

    function resetChapterMcq(chId) {
      const ch = getChapter(chId);
      ch.mcqs.forEach((_, i) => {
        delete state.mcqProgress[chId + ":" + i];
      });
      state.mcqStage = 0;
      saveProgress();
      render();
    }

    function resetChapterGyan(chId) {
      const ch = getChapter(chId);
      ch.gyanmulok.forEach((_, i) => {
        delete state.gyanProgress[chId + ":" + i];
      });
      state.gyanStage = 0;
      saveProgress();
      render();
    }

    function resetModelTestMcq(mtId) {
      const mt = ISLAM_DATA.mcqModelTests.find(m => m.id === mtId);
      mt.questions.forEach((_, i) => {
        delete state.mtMcqProgress[mtId + ":" + i];
      });
      saveProgress();
      render();
    }

    function resetModelTestGyan(mtId) {
      const mt = ISLAM_DATA.gyanModelTests.find(m => m.id === mtId);
      mt.questions.forEach((_, i) => {
        delete state.mtGyanProgress[mtId + ":" + i];
      });
      saveProgress();
      render();
    }

    function revealGyan(scopeKey, isModelTest) {
      const store = isModelTest ? state.mtGyanProgress : state.gyanProgress;
      const prev = store[scopeKey] || { revealed: false, status: null };
      prev.revealed = true;
      store[scopeKey] = prev;
      saveProgress();
      render();
    }

    function markGyan(scopeKey, status, isModelTest) {
      const store = isModelTest ? state.mtGyanProgress : state.gyanProgress;
      const prev = store[scopeKey] || { revealed: true, status: null };
      if (!prev.status && status === "known") {
        state.score += 5;
        state.streak += 1;
      } else if (status === "review") {
        state.streak = 0;
      }
      prev.revealed = true;
      prev.status = status;
      store[scopeKey] = prev;
      saveProgress();
      render();
    }

    function renderHome() {
      const totalSolved = getTotalSolvedCount();
      let html = `
        <div class="islam-stats-bar">
          <div class="islam-stat-card">
            <div class="islam-stat-val">${toBnNum(state.score)}</div>
            <div class="islam-stat-label">🏆 মোট পয়েন্ট</div>
          </div>
          <div class="islam-stat-card">
            <div class="islam-stat-val">${toBnNum(totalSolved)}</div>
            <div class="islam-stat-label">✅ সমাধানকৃত</div>
          </div>
          <div class="islam-stat-card">
            <div class="islam-stat-val">${toBnNum(state.streak)}🔥</div>
            <div class="islam-stat-label">টানা সঠিক</div>
          </div>
        </div>

        <h2 class="islam-section-heading">📚 পাঠ্যবইয়ের অধ্যায়সমূহ</h2>
        <div class="islam-chapter-grid">
      `;

      ISLAM_DATA.chapters.forEach(ch => {
        const mStats = getChapterMcqStats(ch);
        const gStats = getChapterGyanStats(ch);
        html += `
          <button type="button" class="islam-chapter-card" data-open-chapter="${ch.id}">
            <div class="islam-ch-top">
              <span class="islam-ch-badge">${ch.icon} ${escapeHtml(ch.number)}</span>
              <span class="islam-mini-pill">প্রবেশ করুন &rarr;</span>
            </div>
            <h3 class="islam-ch-title">${escapeHtml(ch.title)}</h3>
            <p class="islam-ch-sub">${escapeHtml(ch.subtitle)}</p>
            <div class="islam-ch-meta">
              <span class="islam-mini-pill">📖 সামারি: ${toBnNum(ch.summarySections.length)}টি সেকশন</span>
              <span class="islam-mini-pill">📝 MCQ: ${toBnNum(mStats.solved)}/${toBnNum(mStats.total)}</span>
              <span class="islam-mini-pill">💡 জ্ঞানমূলক: ${toBnNum(gStats.done)}/${toBnNum(gStats.total)}</span>
            </div>
          </button>
        `;
      });

      html += `</div>

        <h2 class="islam-section-heading">🎯 এমসিকিউ মডেল টেস্ট (প্রতিটিতে ৩০টি প্রশ্ন)</h2>
        <div class="islam-chapter-grid">
      `;

      ISLAM_DATA.mcqModelTests.forEach(mt => {
        let solved = 0;
        mt.questions.forEach((_, i) => { if (state.mtMcqProgress[mt.id + ":" + i]?.solved) solved++; });
        html += `
          <button type="button" class="islam-chapter-card" data-open-mt-mcq="${mt.id}">
            <div class="islam-ch-top">
              <span class="islam-ch-badge">📝 মডেল টেস্ট</span>
              <span class="islam-mini-pill">${toBnNum(solved)}/${toBnNum(mt.questions.length)} সম্পন্ন</span>
            </div>
            <h3 class="islam-ch-title">${escapeHtml(mt.title)}</h3>
            <p class="islam-ch-sub">${escapeHtml(mt.subtitle)}</p>
          </button>
        `;
      });

      html += `</div>

        <h2 class="islam-section-heading">🧠 জ্ঞানমূলক মডেল টেস্ট (প্রতিটিতে ২০টি প্রশ্ন)</h2>
        <div class="islam-chapter-grid">
      `;

      ISLAM_DATA.gyanModelTests.forEach(gt => {
        let done = 0;
        gt.questions.forEach((_, i) => { if (state.mtGyanProgress[gt.id + ":" + i]?.status) done++; });
        html += `
          <button type="button" class="islam-chapter-card" data-open-mt-gyan="${gt.id}">
            <div class="islam-ch-top">
              <span class="islam-ch-badge">💡 অ্যাক্টিভ রিকল</span>
              <span class="islam-mini-pill">${toBnNum(done)}/${toBnNum(gt.questions.length)} সম্পন্ন</span>
            </div>
            <h3 class="islam-ch-title">${escapeHtml(gt.title)}</h3>
            <p class="islam-ch-sub">${escapeHtml(gt.subtitle)}</p>
          </button>
        `;
      });

      html += `</div>`;
      return html;
    }

    function renderChapterView() {
      const ch = getChapter(state.chapterId);
      if (!ch) return renderHome();

      let html = `
        <div class="islam-topbar">
          <button type="button" class="islam-btn islam-btn-secondary" data-go-home="1">&larr; সকল অধ্যায়</button>
          <div class="islam-score-badge">🏆 পয়েন্ট: ${toBnNum(state.score)} | 🔥 ${toBnNum(state.streak)}</div>
        </div>

        <div class="islam-summary-card" style="margin-bottom:16px;">
          <div class="islam-ch-badge" style="margin-bottom:6px;">${ch.icon} ${escapeHtml(ch.number)}</div>
          <h2 class="islam-ch-title" style="font-size:1.2rem;">${escapeHtml(ch.title)}</h2>
          <p class="islam-ch-sub">${escapeHtml(ch.subtitle)}</p>
        </div>

        <div class="islam-tabs">
          <button type="button" class="islam-tab-btn ${state.chapterTab === "summary" ? "is-active" : ""}" data-set-tab="summary">📖 সামারি</button>
          <button type="button" class="islam-tab-btn ${state.chapterTab === "mcq" ? "is-active" : ""}" data-set-tab="mcq">📝 এমসিকিউ (৩০)</button>
          <button type="button" class="islam-tab-btn ${state.chapterTab === "gyanmulok" ? "is-active" : ""}" data-set-tab="gyanmulok">💡 জ্ঞানমূলক (২০)</button>
        </div>
      `;

      if (state.chapterTab === "summary") {
        html += `
          <div class="islam-audio-bar">
            <div style="font-size:0.88rem;font-weight:700;">🔊 বাংলা অডিও গতি:</div>
            <div class="islam-speed-group">
              ${[0.75, 1, 1.25].map(r => `
                <button type="button" class="islam-speed-btn ${state.audioRate === r ? "is-active" : ""}" data-set-rate="${r}">${r}x</button>
              `).join("")}
            </div>
          </div>
          ${state.audioNotice ? `<div class="islam-notice">${escapeHtml(state.audioNotice)}</div>` : ""}
        `;

        ch.summarySections.forEach(sec => {
          const isSpeaking = state.speakingId === sec.id;
          html += `
            <div class="islam-summary-card ${isSpeaking ? "is-speaking" : ""}">
              <div class="islam-summary-head">
                <h3 class="islam-summary-title">${escapeHtml(sec.title)}</h3>
                <button type="button" class="islam-btn ${isSpeaking ? "islam-btn-danger" : "islam-btn-primary"}" data-speak-sec="${sec.id}">
                  ${isSpeaking ? "⏹ থামান" : "🔊 বাংলায় শুনুন"}
                </button>
              </div>
              <ul class="islam-points-list">
                ${sec.points.map(p => `<li>${escapeHtml(p)}</li>`).join("")}
              </ul>
            </div>
          `;
        });
      } else if (state.chapterTab === "mcq") {
        const stages = 5;
        const perStage = 6;
        const start = state.mcqStage * perStage;
        const end = start + perStage;
        const slice = ch.mcqs.slice(start, end);

        html += `
          <div class="islam-notice">
            🎯 <strong>নিয়ম:</strong> প্রথম চেষ্টায় সঠিক উত্তরে <strong>+১০ পয়েন্ট</strong>। ভুল অনুমানে <strong>-২ পয়েন্ট</strong> কাটা যাবে; তবে সঠিক উত্তর না পাওয়া পর্যন্ত চেষ্টা চালিয়ে যেতে পারবে।
          </div>
          <div class="islam-stage-bar">
            ${Array.from({ length: stages }, (_, sIdx) => {
              const sStart = sIdx * perStage;
              const sEnd = sStart + perStage;
              let doneCount = 0;
              for (let i = sStart; i < sEnd; i++) {
                if (state.mcqProgress[ch.id + ":" + i]?.solved) doneCount++;
              }
              const isDone = doneCount === perStage;
              return `<button type="button" class="islam-stage-pill ${state.mcqStage === sIdx ? "is-active" : (isDone ? "is-done" : "")}" data-mcq-stage="${sIdx}">সেকশন ${toBnNum(sIdx + 1)} (${toBnNum(doneCount)}/${toBnNum(perStage)})</button>`;
            }).join("")}
            <button type="button" class="islam-btn islam-btn-danger" style="margin-left:auto;min-height:36px;padding:6px 12px;" data-reset-ch-mcq="${ch.id}">🔄 রিসেট</button>
          </div>
        `;

        html += renderMcqList(slice, start, ch.id, false);

        html += `<div class="islam-action-row">`;
        if (state.mcqStage > 0) {
          html += `<button type="button" class="islam-btn islam-btn-secondary" data-mcq-stage="${state.mcqStage - 1}">&larr; আগের সেকশন</button>`;
        } else {
          html += `<span></span>`;
        }
        if (state.mcqStage < stages - 1) {
          html += `<button type="button" class="islam-btn islam-btn-primary" data-mcq-stage="${state.mcqStage + 1}">পরবর্তী সেকশন (${toBnNum(state.mcqStage + 2)}) &rarr;</button>`;
        } else {
          html += `<button type="button" class="islam-btn islam-btn-success" data-set-tab="gyanmulok">💡 জ্ঞানমূলক শুরু করো &rarr;</button>`;
        }
        html += `</div>`;
      } else if (state.chapterTab === "gyanmulok") {
        const stages = 5;
        const perStage = 4;
        const start = state.gyanStage * perStage;
        const end = start + perStage;
        const slice = ch.gyanmulok.slice(start, end);

        html += `
          <div class="islam-notice">
            🧠 <strong>অ্যাক্টিভ রিকল:</strong> প্রথমে উত্তরটি নিজে মনে করার চেষ্টা করো, তারপর <strong>উত্তর দেখুন</strong> বাটনে ক্লিক করে মিলিয়ে নাও (+৫ পয়েন্ট)।
          </div>
          <div class="islam-stage-bar">
            ${Array.from({ length: stages }, (_, sIdx) => {
              const sStart = sIdx * perStage;
              const sEnd = sStart + perStage;
              let doneCount = 0;
              for (let i = sStart; i < sEnd; i++) {
                if (state.gyanProgress[ch.id + ":" + i]?.status) doneCount++;
              }
              const isDone = doneCount === perStage;
              return `<button type="button" class="islam-stage-pill ${state.gyanStage === sIdx ? "is-active" : (isDone ? "is-done" : "")}" data-gyan-stage="${sIdx}">সেকশন ${toBnNum(sIdx + 1)} (${toBnNum(doneCount)}/${toBnNum(perStage)})</button>`;
            }).join("")}
            <button type="button" class="islam-btn islam-btn-danger" style="margin-left:auto;min-height:36px;padding:6px 12px;" data-reset-ch-gyan="${ch.id}">🔄 রিসেট</button>
          </div>
        `;

        html += renderGyanList(slice, start, ch.id, false);

        html += `<div class="islam-action-row">`;
        if (state.gyanStage > 0) {
          html += `<button type="button" class="islam-btn islam-btn-secondary" data-gyan-stage="${state.gyanStage - 1}">&larr; আগের সেকশন</button>`;
        } else {
          html += `<span></span>`;
        }
        if (state.gyanStage < stages - 1) {
          html += `<button type="button" class="islam-btn islam-btn-primary" data-gyan-stage="${state.gyanStage + 1}">পরবর্তী সেকশন (${toBnNum(state.gyanStage + 2)}) &rarr;</button>`;
        } else {
          html += `<button type="button" class="islam-btn islam-btn-success" data-go-home="1">🏠 সব অধ্যায় ও মডেল টেস্ট</button>`;
        }
        html += `</div>`;
      }

      return html;
    }

    function renderMcqList(questions, offset, scopeId, isModelTest) {
      const store = isModelTest ? state.mtMcqProgress : state.mcqProgress;
      const labels = ["ক", "খ", "গ", "ঘ"];
      return questions.map((qObj, idx) => {
        const realIdx = offset + idx;
        const key = scopeId + ":" + realIdx;
        const prog = store[key] || { solved: false, wrongOpts: [], pointsEarned: 0 };

        return `
          <div class="islam-q-card">
            <div class="islam-q-header">
              <span>প্রশ্ন ${toBnNum(realIdx + 1)}${qObj.chapter ? " • " + escapeHtml(qObj.chapter) : ""}</span>
              <span>${prog.solved ? `✅ +${toBnNum(Math.max(0, prog.pointsEarned))} পয়েন্ট` : (prog.wrongOpts.length ? `⚠️ ভুল চেষ্টা: ${toBnNum(prog.wrongOpts.length)}` : "নতুন প্রশ্ন")}</span>
            </div>
            <p class="islam-q-text">${escapeHtml(qObj.q)}</p>
            <div class="islam-opts-grid">
              ${qObj.opts.map((opt, oIdx) => {
                const isCorrectShown = prog.solved && oIdx === qObj.ans;
                const isWrongShown = prog.wrongOpts.includes(oIdx);
                const cls = isCorrectShown ? "is-correct" : (isWrongShown ? "is-wrong" : "");
                const disabled = prog.solved || isWrongShown ? "disabled" : "";
                return `
                  <button type="button" class="islam-opt-btn ${cls}" ${disabled} data-mcq-ans="${key}|${oIdx}|${isModelTest ? 1 : 0}">
                    <strong>${labels[oIdx]}.</strong>
                    <span>${escapeHtml(opt)}</span>
                  </button>
                `;
              }).join("")}
            </div>
            ${prog.solved ? `
              <div class="islam-feedback ok">
                <strong>সঠিক উত্তর!</strong> ${escapeHtml(qObj.exp || "")}
              </div>
            ` : (prog.wrongOpts.length > 0 ? `
              <div class="islam-feedback err">
                ভুল উত্তর (-২ পয়েন্ট)। আবার চেষ্টা করো!
              </div>
            ` : "")}
          </div>
        `;
      }).join("");
    }

    function renderGyanList(questions, offset, scopeId, isModelTest) {
      const store = isModelTest ? state.mtGyanProgress : state.gyanProgress;
      return questions.map((qObj, idx) => {
        const realIdx = offset + idx;
        const key = scopeId + ":" + realIdx;
        const prog = store[key] || { revealed: false, status: null };
        return `
          <div class="islam-q-card">
            <div class="islam-q-header">
              <span>জ্ঞানমূলক ${toBnNum(realIdx + 1)}${qObj.chapter ? " • " + escapeHtml(qObj.chapter) : ""}</span>
              <span>${prog.status === "known" ? "✅ মনে ছিল (+৫)" : (prog.status === "review" ? "🔁 আবার পড়বে" : "🔒 উত্তর লুকানো")}</span>
            </div>
            <p class="islam-q-text">${escapeHtml(qObj.q)}</p>
            ${!prog.revealed ? `
              <button type="button" class="islam-btn islam-btn-primary" data-reveal-gyan="${key}|${isModelTest ? 1 : 0}">👁️ উত্তর দেখুন</button>
            ` : `
              <div class="islam-recall-box">
                <strong>উত্তর:</strong> ${escapeHtml(qObj.a)}
              </div>
              <div class="islam-recall-actions">
                <button type="button" class="islam-btn ${prog.status === "known" ? "islam-btn-success" : "islam-btn-secondary"}" data-mark-gyan="${key}|known|${isModelTest ? 1 : 0}">✅ মনে ছিল (+৫ পয়েন্ট)</button>
                <button type="button" class="islam-btn ${prog.status === "review" ? "islam-btn-danger" : "islam-btn-secondary"}" data-mark-gyan="${key}|review|${isModelTest ? 1 : 0}">🔁 আবার দেখব</button>
              </div>
            `}
          </div>
        `;
      }).join("");
    }

    function renderModelTestMcq() {
      const mt = ISLAM_DATA.mcqModelTests.find(m => m.id === state.mtId);
      if (!mt) return renderHome();
      let solved = 0;
      let firstTry = 0;
      mt.questions.forEach((_, i) => {
        const p = state.mtMcqProgress[mt.id + ":" + i];
        if (p?.solved) {
          solved++;
          if (p.wrongOpts.length === 0) firstTry++;
        }
      });

      return `
        <div class="islam-topbar">
          <button type="button" class="islam-btn islam-btn-secondary" data-go-home="1">&larr; ফিরে যাও</button>
          <div class="islam-score-badge">🏆 পয়েন্ট: ${toBnNum(state.score)} | সম্পন্ন: ${toBnNum(solved)}/${toBnNum(mt.questions.length)}</div>
        </div>
        <div class="islam-summary-card">
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">
            <div>
              <h2 class="islam-ch-title">${escapeHtml(mt.title)}</h2>
              <p class="islam-ch-sub">${escapeHtml(mt.subtitle)} (প্রথম চেষ্টায় সঠিক: ${toBnNum(firstTry)})</p>
            </div>
            <button type="button" class="islam-btn islam-btn-danger" data-reset-mt-mcq="${mt.id}">🔄 টেস্ট রিসেট করুন</button>
          </div>
        </div>
        ${renderMcqList(mt.questions, 0, mt.id, true)}
      `;
    }

    function renderModelTestGyan() {
      const gt = ISLAM_DATA.gyanModelTests.find(g => g.id === state.mtId);
      if (!gt) return renderHome();
      let done = 0;
      gt.questions.forEach((_, i) => {
        if (state.mtGyanProgress[gt.id + ":" + i]?.status) done++;
      });

      return `
        <div class="islam-topbar">
          <button type="button" class="islam-btn islam-btn-secondary" data-go-home="1">&larr; ফিরে যাও</button>
          <div class="islam-score-badge">🏆 পয়েন্ট: ${toBnNum(state.score)} | সম্পন্ন: ${toBnNum(done)}/${toBnNum(gt.questions.length)}</div>
        </div>
        <div class="islam-summary-card">
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">
            <div>
              <h2 class="islam-ch-title">${escapeHtml(gt.title)}</h2>
              <p class="islam-ch-sub">${escapeHtml(gt.subtitle)}</p>
            </div>
            <button type="button" class="islam-btn islam-btn-danger" data-reset-mt-gyan="${gt.id}">🔄 রিসেট করুন</button>
          </div>
        </div>
        ${renderGyanList(gt.questions, 0, gt.id, true)}
      `;
    }

    function render() {
      const root = document.getElementById("appRoot");
      if (!root) return;
      if (state.view === "chapter") {
        root.innerHTML = renderChapterView();
      } else if (state.view === "mcq-mt") {
        root.innerHTML = renderModelTestMcq();
      } else if (state.view === "gyan-mt") {
        root.innerHTML = renderModelTestGyan();
      } else {
        root.innerHTML = renderHome();
      }
    }

    document.addEventListener("click", function (e) {
      const target = e.target.closest("button");
      if (!target) return;

      if (target.dataset.openChapter) {
        openChapter(target.dataset.openChapter);
      } else if (target.dataset.openMtMcq) {
        openModelTest("mcq-mt", target.dataset.openMtMcq);
      } else if (target.dataset.openMtGyan) {
        openModelTest("gyan-mt", target.dataset.openMtGyan);
      } else if (target.dataset.goHome) {
        goHome();
      } else if (target.dataset.setTab) {
        stopAudio();
        state.chapterTab = target.dataset.setTab;
        render();
      } else if (target.dataset.setRate) {
        state.audioRate = Number(target.dataset.setRate);
        window.Class7Audio.setRate(state.audioRate);
        render();
      } else if (target.dataset.speakSec) {
        const ch = getChapter(state.chapterId);
        const sec = ch.summarySections.find(s => s.id === target.dataset.speakSec);
        if (sec) {
          const text = sec.title + "। " + sec.points.join(" ");
          speakSection(sec.id, text);
        }
      } else if (target.dataset.mcqStage !== undefined) {
        state.mcqStage = Number(target.dataset.mcqStage);
        render();
        window.scrollTo({ top: 180, behavior: "smooth" });
      } else if (target.dataset.gyanStage !== undefined) {
        state.gyanStage = Number(target.dataset.gyanStage);
        render();
        window.scrollTo({ top: 180, behavior: "smooth" });
      } else if (target.dataset.resetChMcq) {
        resetChapterMcq(target.dataset.resetChMcq);
      } else if (target.dataset.resetChGyan) {
        resetChapterGyan(target.dataset.resetChGyan);
      } else if (target.dataset.resetMtMcq) {
        resetModelTestMcq(target.dataset.resetMtMcq);
      } else if (target.dataset.resetMtGyan) {
        resetModelTestGyan(target.dataset.resetMtGyan);
      } else if (target.dataset.mcqAns) {
        const [key, oIdxStr, isMtStr] = target.dataset.mcqAns.split("|");
        const isMt = isMtStr === "1";
        const [scopeId, qIdxStr] = key.split(":");
        const qIdx = Number(qIdxStr);
        let qObj = null;
        if (isMt) {
          const mt = ISLAM_DATA.mcqModelTests.find(m => m.id === scopeId);
          qObj = mt?.questions[qIdx];
        } else {
          const ch = getChapter(scopeId);
          qObj = ch?.mcqs[qIdx];
        }
        if (qObj) handleMcqAnswer(key, qObj, Number(oIdxStr), isMt);
      } else if (target.dataset.revealGyan) {
        const [key, isMtStr] = target.dataset.revealGyan.split("|");
        revealGyan(key, isMtStr === "1");
      } else if (target.dataset.markGyan) {
        const [key, status, isMtStr] = target.dataset.markGyan.split("|");
        markGyan(key, status, isMtStr === "1");
      }
    });

    loadProgress();
    render();
  </script>
</body>
</html>
