<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>৭ম শ্রেণির বিজ্ঞান — ইন্টারঅ্যাক্টিভ লার্নিং ও মডেল টেস্ট</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-light: #ccfbf1;
      --accent: #4f46e5;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warn: #d97706;
      --warn-bg: #fef3c7;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      --font-bn: 'Noto Sans Bengali', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15.5px; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-bn);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }
    .topbar-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      text-align: left;
      color: var(--text);
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d9488, #0284c7);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }
    .brand-title { font-size: 1.02rem; font-weight: 700; line-height: 1.2; }
    .brand-sub { font-size: 0.76rem; color: var(--text-muted); font-weight: 500; }

    .hud {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .hud-pill.xp { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .hud-pill.streak { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
    .hud-pill.rank { background: #eef2ff; border-color: #c7d2fe; color: #3730a3; }
    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Container */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 14px 56px;
    }

    /* Hero Banner */
    .hero {
      background: linear-gradient(135deg, #0f766e 0%, #0284c7 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 18px 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    .hero h1 { font-size: 1.25rem; font-weight: 800; margin-bottom: 4px; }
    .hero p { font-size: 0.9rem; opacity: 0.93; margin-bottom: 12px; }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .hero-stat {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }
    .hero-stat strong { display: block; font-size: 1.05rem; font-weight: 800; }
    .hero-stat span { font-size: 0.76rem; opacity: 0.9; }

    /* Section Headings */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 10px;
      gap: 8px;
    }
    .sec-head h2 { font-size: 1.08rem; font-weight: 800; color: var(--text); }
    .sec-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card:active { transform: scale(0.99); }
    .card:hover { border-color: #94a3b8; }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .ch-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      color: #fff;
    }
    .ch-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 2px;
    }
    .ch-title { font-size: 1.02rem; font-weight: 800; line-height: 1.3; }
    .ch-sub { font-size: 0.84rem; color: var(--text-muted); line-height: 1.4; margin-top: 2px; }

    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .progress-bar {
      height: 7px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0d9488, #0284c7);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border-color: #fecaca; }
    .btn-success { background: var(--success-bg); color: var(--success); border-color: #bbf7d0; }
    .btn-sm { min-height: 36px; padding: 5px 11px; font-size: 0.82rem; }

    /* Chapter Header & Tabs */
    .back-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .chapter-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #e2e8f0;
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      padding: 9px 6px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 42px;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--surface);
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    /* Audio Control Bar */
    .audio-bar {
      background: #f0fdfa;
      border: 1px solid #99f6e4;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .speed-group { display: flex; align-items: center; gap: 4px; }
    .speed-pill {
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid #99f6e4;
      background: #fff;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--primary-dark);
    }
    .speed-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Summary Cards */
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .summary-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .summary-title { font-size: 1rem; font-weight: 800; color: var(--primary-dark); }
    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #0d9488;
      background: #f0fdfa;
      color: #0f766e;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      min-height: 36px;
    }
    .audio-btn.playing {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }
    .summary-list {
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 0.94rem;
      color: var(--text);
    }

    /* Stage Selector & Quiz Controls */
    .stage-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .stage-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .stage-pill {
      min-height: 38px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
    }
    .stage-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .stage-pill.done {
      border-color: var(--success);
      color: var(--success);
      background: #f0fdf4;
    }
    .stage-pill.active.done {
      background: var(--success);
      color: #fff;
    }

    /* Question Cards */
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .q-delta {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
    }
    .q-delta.pos { background: var(--success-bg); color: var(--success); }
    .q-delta.neg { background: var(--danger-bg); color: var(--danger); }

    .q-text {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }
    .opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0fdfa; }
    .opt-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #14532d;
    }
    .opt-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #7f1d1d;
    }
    .opt-tag {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: #e2e8f0;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .opt-btn.correct .opt-tag { background: var(--success); color: #fff; }
    .opt-btn.wrong .opt-tag { background: var(--danger); color: #fff; }

    .exp-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      font-size: 0.86rem;
      color: #166534;
    }

    /* Gyanmulok Active Recall */
    .recall-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-top: 8px;
    }
    .recall-ans {
      font-size: 0.94rem;
      color: #0f172a;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .recall-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Score Summary Banner */
    .score-banner {
      background: linear-gradient(135deg, #eef2ff, #ecfeff);
      border: 1px solid #c7d2fe;
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Toast & Modal */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      place-items: center;
      padding: 16px;
      z-index: 90;
    }
    .modal-backdrop.open { display: grid; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
    .modal p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="homeBtn" type="button">
        <div class="brand-icon">🔬</div>
        <div>
          <div class="brand-title">৭ম শ্রেণির বিজ্ঞান</div>
          <div class="brand-sub">সামারি • MCQ • জ্ঞানমূলক • মডেল টেস্ট</div>
        </div>
      </button>
      <div class="hud">
        <span class="hud-pill xp" id="hudXp">⭐ ০ পয়েন্ট</span>
        <span class="hud-pill streak" id="hudStreak">🔥 ০</span>
        <span class="hud-pill rank" id="hudRank">নতুন শিক্ষার্থী</span>
        <button class="icon-btn" id="soundToggleBtn" type="button" title="সাউন্ড চালু/বন্ধ">🔊</button>
      </div>
    </div>
  </header>

  <main class="container" id="appRoot"></main>

  <div class="toast" id="toastEl"></div>

  <div class="modal-backdrop" id="confirmModal">
    <div class="modal">
      <h3 id="modalTitle">রিসেট করবেন?</h3>
      <p id="modalDesc">এই অংশের উত্তর ও স্কোর মুছে আবার নতুন করে শুরু করা হবে।</p>
      <div class="modal-actions">
        <button class="btn btn-sm" id="modalCancel" type="button">বাতিল</button>
        <button class="btn btn-sm btn-danger" id="modalConfirm" type="button">হ্যাঁ, রিসেট করুন</button>
      </div>
    </div>
  </div>

  <script>

      // gyanProgress[scopeKey][qIdx] = { revealed: bool, status: 'none'|'knew'|'review' }
      gyanProgress: {}
    };

    // Load saved progress safely
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (typeof saved.xp === 'number') state.xp = saved.xp;
        if (typeof saved.streak === 'number') state.streak = saved.streak;
        if (typeof saved.soundEnabled === 'boolean') state.soundEnabled = saved.soundEnabled;
        if (saved.mcqProgress) state.mcqProgress = saved.mcqProgress;
        if (saved.gyanProgress) state.gyanProgress = saved.gyanProgress;
      }
    } catch (e) {}

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          xp: state.xp,
          streak: state.streak,
          soundEnabled: state.soundEnabled,
          mcqProgress: state.mcqProgress,
          gyanProgress: state.gyanProgress
        }));
      } catch (e) {}
    }

    function toBn(num) {
      const map = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
      return String(num).replace(/\d/g, d => map[d]);
    }

    function getRank(xp) {
      if (xp >= 1500) return '🏆 বিজ্ঞান চ্যাম্পিয়ন';
      if (xp >= 800) return '🚀 জুনিয়র বিজ্ঞানী';
      if (xp >= 300) return '🔭 বিজ্ঞান অনুসন্ধিৎসু';
      return '🌱 নতুন শিক্ষার্থী';
    }

    function showToast(msg) {
      const el = document.getElementById('toastEl');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    // Web Audio API feedback
    let audioCtx = null;
    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'ok') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(165, now + 0.18);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        }
      } catch (e) {}
    }

    // Bangla-only Web Speech API TTS
    function stopSpeech() {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      } catch (e) {}
      state.speakingKey = null;
    }

    function pickBanglaVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('bn-bd'))
        || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('bn'))
        || null;
    }

    function toggleBanglaAudio(key, text) {
      if (!('speechSynthesis' in window)) {
        showToast('এই ব্রাউজারে বাংলা অডিও সমর্থন করে না।');
        return;
      }
      if (state.speakingKey === key) {
        stopSpeech();
        render();
        return;
      }
      stopSpeech();
      try {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'bn-BD';
        const voice = pickBanglaVoice();
        if (voice) utter.voice = voice;
        utter.rate = state.audioSpeed;
        utter.onend = () => {
          state.speakingKey = null;
          render();
        };
        utter.onerror = () => {
          state.speakingKey = null;
          render();
        };
        state.speakingKey = key;
        window.speechSynthesis.speak(utter);
        render();
      } catch (e) {
        showToast('অডিও চালু করা যায়নি। ফোনে Google বাংলা ভয়েস চালু রাখুন।');
      }
    }

    function getScopeMcqStats(scopeKey, totalCount) {
      const map = state.mcqProgress[scopeKey] || {};
      let solved = 0;
      let score = 0;
      for (let i = 0; i < totalCount; i++) {
        if (map[i]) {
          if (map[i].solved) solved++;
          score += (map[i].pointsDelta || 0);
        }
      }
      return { solved, score, total: totalCount };
    }

    function getScopeGyanStats(scopeKey, totalCount) {
      const map = state.gyanProgress[scopeKey] || {};
      let knew = 0;
      for (let i = 0; i < totalCount; i++) {
        if (map[i] && map[i].status === 'knew') knew++;
      }
      return { knew, total: totalCount };
    }

    function handleMcqClick(scopeKey, qIdx, optIdx, correctIdx) {
      if (!state.mcqProgress[scopeKey]) state.mcqProgress[scopeKey] = {};
      const entry = state.mcqProgress[scopeKey][qIdx] || { solved: false, wrongTries: [], pointsDelta: 0 };
      if (entry.solved) return;

      if (optIdx === correctIdx) {
        const earned = entry.wrongTries.length === 0 ? 10 : 5;
        entry.solved = true;
        entry.pointsDelta += earned;
        state.xp += earned;
        state.streak += 1;
        state.mcqProgress[scopeKey][qIdx] = entry;
        playTone('ok');
        showToast(`সঠিক উত্তর! +${toBn(earned)} পয়েন্ট`);
      } else {
        if (!entry.wrongTries.includes(optIdx)) {
          entry.wrongTries.push(optIdx);
          entry.pointsDelta -= 2;
          state.xp = Math.max(0, state.xp - 2);
          state.streak = 0;
          state.mcqProgress[scopeKey][qIdx] = entry;
          playTone('err');
          showToast('ভুল উত্তর! -২ পয়েন্ট, আবার চেষ্টা করো');
        }
      }
      saveProgress();
      render();
    }

    function resetMcqScope(scopeKey) {

          showToast('রিসেট সম্পন্ন হয়েছে! আবার শুরু করো।');
          render();

    }

    function toggleGyanReveal(scopeKey, qIdx) {
      if (!state.gyanProgress[scopeKey]) state.gyanProgress[scopeKey] = {};
      const entry = state.gyanProgress[scopeKey][qIdx] || { revealed: false, status: 'none' };

    function markGyanStatus(scopeKey, qIdx, status) {
      if (!state.gyanProgress[scopeKey]) state.gyanProgress[scopeKey] = {};
      const entry = state.gyanProgress[scopeKey][qIdx] || { revealed: true, status: 'none' };
      if (entry.status !== 'knew' && status === 'knew') {
        state.xp += 5;
        state.streak += 1;

        showToast('দারুণ! +৫ পয়েন্ট');
      } else if (entry.status === 'knew' && status !== 'knew') {
        state.xp = Math.max(0, state.xp - 5);
      }
      entry.status = status;
      entry.revealed = true;
      state.gyanProgress[scopeKey][qIdx] = entry;
      saveProgress();
      render();
    }

            <div class="q-meta">
              <span>প্রশ্ন ${toBn(qIdx + 1)} / ${toBn(questions.length)}${item.ch ? ' • ' + item.ch : ''}</span>
              ${entry.status === 'knew' ? '<span class="q-delta pos">✓ পেরেছি (+৫)</span>' : (entry.status === 'review' ? '<span class="q-delta neg">🔁 আবার দেখব</span>' : '')}
            </div>
            <div class="q-text">${item.q}</div>
            <button class="btn btn-sm ${entry.revealed ? '' : 'btn-primary'}" type="button" data-action="toggle-gyan" data-scope="${scopeKey}" data-q="${qIdx}">
              ${entry.revealed ? '🙈 উত্তর লুকান' : '👁️ উত্তর দেখুন'}
            </button>
        `;
        if (entry.revealed) {
          html += `
            <div class="recall-box">
              <div class="recall-ans"><strong>উত্তর:</strong> ${item.a}</div>
              <div class="recall-actions">
                <button class="btn btn-sm ${entry.status === 'knew' ? 'btn-success' : ''}" type="button" data-action="mark-gyan" data-scope="${scopeKey}" data-q="${qIdx}" data-status="knew">✅ পেরেছি (+৫)</button>
                <button class="btn btn-sm ${entry.status === 'review' ? 'btn-danger' : ''}" type="button" data-action="mark-gyan" data-scope="${scopeKey}" data-q="${qIdx}" data-status="review">🔁 আবার দেখব</button>
                <button class="audio-btn ${isPlaying ? 'playing' : ''}" type="button" data-action="speak-gyan" data-key="${audioKey}" data-scope="${scopeKey}" data-q="${qIdx}">
                  ${isPlaying ? '⏹️ থামুন' : '🔊 শুনুন'}
                </button>
              </div>
            </div>
          `;
        }
        html += `</div>`;
      });

      html += `<div style="display:flex;justify-content:space-between;margin-top:12px;gap:8px;">
        <button class="btn btn-sm" type="button" ${stageIdx === 0 ? 'disabled' : ''} data-action="set-stage" data-stage="${stageIdx - 1}">← আগের সেকশন</button>
        <button class="btn btn-sm btn-primary" type="button" ${stageIdx >= totalStages - 1 ? 'disabled' : ''} data-action="set-stage" data-stage="${stageIdx + 1}">পরের সেকশন →</button>
      </div>`;

      return html;
    }

    function renderChapterView() {
      const ch = APP_DATA.chapters.find(c => c.id === state.chapterId);
      if (!ch) return renderHome();

      let html = `
        <div class="back-row">
          <button class="btn btn-sm" type="button" data-action="go-home">← সকল অধ্যায়</button>
          <span class="sec-badge">${ch.number}</span>
        </div>
        <div class="chapter-banner">
          <div class="ch-icon" style="background:${ch.color}">${ch.icon}</div>
          <div>
            <div class="ch-title">${ch.title}</div>
            <div class="ch-sub">${ch.subtitle}</div>
          </div>
        </div>
        <div class="tabs">
          <button class="tab-btn ${state.tab === 'summary' ? 'active' : ''}" type="button" data-action="set-tab" data-tab="summary">📖 সামারি</button>
          <button class="tab-btn ${state.tab === 'mcq' ? 'active' : ''}" type="button" data-action="set-tab" data-tab="mcq">📝 MCQ (${toBn(ch.mcqs.length)})</button>
          <button class="tab-btn ${state.tab === 'gyan' ? 'active' : ''}" type="button" data-action="set-tab" data-tab="gyan">💡 জ্ঞানমূলক (${toBn(ch.gyanmulok.length)})</button>
        </div>
      `;

      if (state.tab === 'summary') {
        html += `
          <div class="audio-bar">
            <span style="font-size:0.84rem;font-weight:700;color:var(--primary-dark);">🔊 বাংলা অডিও গতি:</span>
            <div class="speed-group">
              ${[0.85, 1.0, 1.15].map(sp => `
                <button class="speed-pill ${state.audioSpeed === sp ? 'active' : ''}" type="button" data-action="set-speed" data-speed="${sp}">${toBn(sp)}x</button>
              `).join('')}
            </div>
          </div>
        `;
        ch.summaries.forEach((sec, idx) => {
          const audioKey = `sum_${ch.id}_${idx}`;
          const isPlaying = state.speakingKey === audioKey;
          html += `
            <div class="summary-card">
              <div class="summary-head">
                <div class="summary-title">${sec.title}</div>
                <button class="audio-btn ${isPlaying ? 'playing' : ''}" type="button" data-action="speak-summary" data-key="${audioKey}" data-ch="${ch.id}" data-idx="${idx}">
                  ${isPlaying ? '⏹️ থামুন' : '🔊 শুনুন'}
                </button>
              </div>
              <ul class="summary-list">
                ${sec.points.map(pt => `<li>${pt}</li>`).join('')}
              </ul>
            </div>
          `;
        });
      } else if (state.tab === 'mcq') {
        html += renderMcqBlock(ch.id, ch.mcqs, state.stage, 6);
      } else {
        html += renderGyanBlock(ch.id, ch.gyanmulok, state.stage, 4);
      }
      return html;
    }

    function renderMcqTestView() {
      const mt = APP_DATA.mcqTests.find(t => t.id === state.testId);
      if (!mt) return renderHome();
      return `
        <div class="back-row">
          <button class="btn btn-sm" type="button" data-action="go-home">← হোমে ফিরুন</button>
          <span class="sec-badge">৩০টি MCQ</span>
        </div>
        <div class="chapter-banner">
          <div class="ch-icon" style="background:#4f46e5">📝</div>
          <div>
            <div class="ch-title">${mt.title}</div>
            <div class="ch-sub">${mt.subtitle}</div>
          </div>
        </div>
        ${renderMcqBlock(mt.id, mt.questions, state.testStage, 6)}
      `;
    }

    function renderGyanTestView() {
      const gt = APP_DATA.gyanTests.find(t => t.id === state.testId);
      if (!gt) return renderHome();
      return `
        <div class="back-row">
          <button class="btn btn-sm" type="button" data-action="go-home">← হোমে ফিরুন</button>
          <span class="sec-badge">২০টি জ্ঞানমূলক</span>
        </div>
        <div class="chapter-banner">
          <div class="ch-icon" style="background:#0d9488">💡</div>
          <div>
            <div class="ch-title">${gt.title}</div>
            <div class="ch-sub">${gt.subtitle}</div>
          </div>
        </div>
        ${renderGyanBlock(gt.id, gt.questions, state.testStage, 4)}
      `;
    }

    function render() {
      updateHud();
      const root = document.getElementById('appRoot');
      if (state.view === 'home') root.innerHTML = renderHome();
      else if (state.view === 'chapter') root.innerHTML = renderChapterView();
      else if (state.view === 'mcq_test') root.innerHTML = renderMcqTestView();
      else if (state.view === 'gyan_test') root.innerHTML = renderGyanTestView();
    }

    // Event Delegation
    document.getElementById('homeBtn').addEventListener('click', () => {
      stopSpeech();
      state.view = 'home';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('soundToggleBtn').addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      saveProgress();
      updateHud();
      showToast(state.soundEnabled ? 'সাউন্ড চালু করা হয়েছে' : 'সাউন্ড বন্ধ করা হয়েছে');
    });

    document.getElementById('appRoot').addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'go-home') {
        stopSpeech();
        state.view = 'home';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (action === 'open-ch') {
        stopSpeech();
        state.view = 'chapter';
        state.chapterId = target.dataset.id;
        state.tab = 'summary';
        state.stage = 0;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (action === 'open-mcq-test') {
        stopSpeech();
        state.view = 'mcq_test';
        state.testId = target.dataset.id;
        state.testStage = 0;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (action === 'open-gyan-test') {
        stopSpeech();
        state.view = 'gyan_test';
        state.testId = target.dataset.id;
        state.testStage = 0;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (action === 'set-tab') {
        stopSpeech();
        state.tab = target.dataset.tab;
        state.stage = 0;
        render();
      } else if (action === 'set-stage') {
        const s = parseInt(target.dataset.stage, 10);
        if (state.view === 'chapter') state.stage = s;
        else state.testStage = s;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (action === 'set-speed') {
        state.audioSpeed = parseFloat(target.dataset.speed);
        render();
      } else if (action === 'speak-summary') {
        const ch = APP_DATA.chapters.find(c => c.id === target.dataset.ch);
        const sec = ch && ch.summaries[parseInt(target.dataset.idx, 10)];
        if (sec) {
          const text = sec.title + '। ' + sec.points.join(' ');
          toggleBanglaAudio(target.dataset.key, text);
        }
      } else if (action === 'speak-gyan') {
        const scope = target.dataset.scope;
        const qIdx = parseInt(target.dataset.q, 10);
        let item = null;
        const ch = APP_DATA.chapters.find(c => c.id === scope);
        if (ch) item = ch.gyanmulok[qIdx];
        else {
          const gt = APP_DATA.gyanTests.find(t => t.id === scope);
          if (gt) item = gt.questions[qIdx];
        }
        if (item) toggleBanglaAudio(target.dataset.key, item.q + ' উত্তর: ' + item.a);
      } else if (action === 'ans-mcq') {
        handleMcqClick(
          target.dataset.scope,
          parseInt(target.dataset.q, 10),
          parseInt(target.dataset.o, 10),
          parseInt(target.dataset.ans, 10)
        );
      } else if (action === 'reset-mcq') {
        resetMcqScope(target.dataset.scope);
      } else if (action === 'toggle-gyan') {
        toggleGyanReveal(target.dataset.scope, parseInt(target.dataset.q, 10));
      } else if (action === 'mark-gyan') {
        markGyanStatus(target.dataset.scope, parseInt(target.dataset.q, 10), target.dataset.status);
      } else if (action === 'reset-gyan') {
        resetGyanScope(target.dataset.scope);
      }
    });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }
    render();
  </script>
</body>
</html>
