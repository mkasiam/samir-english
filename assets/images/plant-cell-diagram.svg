<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="plantCellTitle">
  <title id="plantCellTitle">Labeled Plant Cell Diagram</title>
  <rect width="600" height="360" rx="20" fill="#f0fdfa" />
  <!-- Cell Wall -->
  <rect x="90" y="45" width="320" height="270" rx="34" fill="#bbf7d0" stroke="#15803d" stroke-width="10" />
  <!-- Cell Membrane -->
  <rect x="108" y="63" width="284" height="234" rx="24" fill="#ecfdf5" stroke="#16a34a" stroke-width="4" />
  <!-- Vacuole -->
  <ellipse cx="220" cy="185" rx="82" ry="66" fill="#bae6fd" stroke="#0284c7" stroke-width="4" />
  <text x="220" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0369a1">Vacuole</text>
  <!-- Nucleus -->
  <circle cx="332" cy="130" r="34" fill="#ddd6fe" stroke="#6d28d9" stroke-width="4" />
  <circle cx="332" cy="130" r="12" fill="#5b21b6" />
  <!-- Chloroplasts -->
  <ellipse cx="155" cy="100" rx="24" ry="12" fill="#22c55e" stroke="#166534" stroke-width="2" />
  <ellipse cx="335" cy="245" rx="24" ry="12" fill="#22c55e" stroke="#166534" stroke-width="2" />
  <!-- Labels -->
  <line x1="410" y1="80" x2="455" y2="80" stroke="#1e293b" stroke-width="2" />
  <text x="462" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Cell Wall</text>

  <line x1="366" y1="130" x2="455" y2="130" stroke="#1e293b" stroke-width="2" />
  <text x="462" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Nucleus</text>

  <line x1="359" y1="245" x2="455" y2="245" stroke="#1e293b" stroke-width="2" />
  <text x="462" y="250" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Chloroplast</text>

  <text x="250" y="338" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">Class 7 Science — Typical Plant Cell</text>
</svg>
